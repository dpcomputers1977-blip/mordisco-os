<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal | Mordisco</title><link rel="stylesheet" href="/portal.css?v=12"><meta name="theme-color" content="#11100e"></head><body>
<main class="portalWrap"><section class="portalCard"><img src="/mordisco-logo.png"><span>PORTAL DEL PERSONAL</span><h1>Iniciar sesión</h1><p>Selecciona tu nombre e ingresa tu PIN.</p><select id="staffEmployee"></select><input id="staffPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN de 4 a 6 números"><button id="staffLogin">Ingresar</button><small id="staffMessage"></small><a href="/">Volver a la página</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://nmmjthqflxwucpmmmrks.supabase.co","sb_publishable_izCztp4wZ0MzKOHjT2KGYA_ot_3pgb0");const $=s=>document.querySelector(s);let staff=[];async function start(){const{data,error}=await db.from("staff").select("id,name,role").eq("active",true).order("name");if(error)return $("#staffMessage").textContent=error.message;staff=data||[];$("#staffEmployee").innerHTML=staff.map(s=>`<option value="${s.id}">${s.name} — ${({admin:"Administrador",waiter:"Mesero",cashier:"Cajero",kitchen:"Cocina"})[s.role]||s.role}</option>`).join("")}async function login(){const id=$("#staffEmployee").value,pin=$("#staffPin").value.trim();if(!/^\d{4,6}$/.test(pin))return $("#staffMessage").textContent="PIN inválido";const{data,error}=await db.rpc("verify_staff_pin",{staff_id:id,staff_pin:pin});if(error||!data)return $("#staffMessage").textContent="PIN incorrecto";const e=staff.find(x=>x.id===id);localStorage.setItem("mordisco_employee",JSON.stringify(e));if(e.role==="waiter")location.href="/comandas";else if(e.role==="kitchen")location.href="/?employee=1#kitchen";else if(e.role==="cashier")location.href="/?employee=1#pos";else location.href="/admin"}$("#staffLogin").onclick=login;$("#staffPin").onkeydown=e=>{if(e.key==="Enter")login()};start();</script></body></html>
